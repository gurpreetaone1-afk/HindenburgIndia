  <defs>
    <linearGradient id="adminbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#adminbg)"/>
  <defs>
    <clipPath id="hclip_admin">
      <rect x="132" y="96" width="68" height="320" rx="6"/>
      <rect x="312" y="96" width="68" height="320" rx="6"/>
      <rect x="132" y="214" width="248" height="84"/>
    </clipPath>
  </defs>
